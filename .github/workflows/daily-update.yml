name: Daily Stock Update

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC daily
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        working-directory: scripts
        run: python fetch_data.py

      - name: Run technical analysis
        working-directory: scripts
        run: python ta_engine.py

      - name: Generate dashboard
        working-directory: scripts
        run: python generate_dashboard.py

      - name: Generate email and chart images
        working-directory: scripts
        run: python generate_email.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Send email
        working-directory: scripts
        continue-on-error: true
        run: python send_email.py
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Archive today's output
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p site/archive/$DATE
          [ -d site/dashboard ] && cp -r site/dashboard site/archive/$DATE/ || true
          [ -d site/report ] && cp -r site/report site/archive/$DATE/ || true

      - name: Prune old archives (keep 90 days)
        run: |
          if [ -d site/archive ]; then
            CUTOFF=$(date -d '90 days ago' +%Y-%m-%d)
            cd site/archive
            for dir in 20*; do
              if [ -d "$dir" ] && [ "$dir" \< "$CUTOFF" ]; then
                rm -rf "$dir"
                echo "Pruned $dir"
              fi
            done
          fi

      - name: Generate archive index
        working-directory: scripts
        run: python generate_archive_index.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: "Update $(date +%Y-%m-%d)"
